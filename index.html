<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121629">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>BSides CBR 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121629'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f5b83d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens ---------- */
:root{
  --bg:#121629; --surface:#1a1f3b; --surface2:#262d55; --line:#2f3763;
  --text:#efebe1; --muted:#a0a5c2; --live:#f5b83d; --live-ink:#2a1d00; --ok:#6ad39a;
  --r-md:14px;
  --display:"Bricolage Grotesque", ui-rounded, system-ui, -apple-system, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --chrome-h:200px; --keep-h:0px; --hide:0px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
[role="button"]{touch-action:manipulation}
:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.muted{color:var(--muted)}
mark{background:rgba(245,184,61,.32);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- Fixed chrome. Filter rows slide away on scroll down, back on scroll up ---------- */
.notch{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:25}
.chrome{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.chrome.collapsed{transform:translateY(calc(-1 * var(--hide)))}
@media (prefers-reduced-motion:no-preference){.chrome{transition:transform .22s ease}}
.row-wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px}
.brand{font:800 20px/1 var(--display);letter-spacing:-.01em;margin:0}
.brand span{font-weight:500;color:var(--muted)}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--live)}

/* Search */
.searchline{display:flex;gap:8px;margin-bottom:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;background:var(--surface);border-radius:12px;padding:0 4px 0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--text);font:16px var(--body);outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.qclear{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);font-size:18px;line-height:1;flex:none}

/* Everyone / Mine / Group */
.seg{display:flex;background:var(--surface);border-radius:11px;padding:3px;margin-bottom:8px}
.seg button{flex:1;min-height:36px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
.seg .n{font-size:12px;font-weight:700;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:rgba(255,255,255,.08);padding:0 6px}
.seg button[aria-pressed="true"] .n{background:var(--live);color:var(--live-ink)}

/* Room type chips + Rooms button */
.chipsrow{display:flex;align-items:center;gap:8px;padding-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chips.overflow{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);padding-right:18px}
.chip{flex:none;min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip[aria-pressed="mixed"]{color:var(--text);border-color:var(--text)}
.chip[aria-pressed="mixed"]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--live)}
.roomsbtn{flex:none;height:44px;min-width:44px;padding:0 11px;border-radius:12px;border:1px solid transparent;background:var(--surface);justify-content:center;color:var(--text);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.roomsbtn svg{width:20px;height:20px}
.roomsbtn.on{border-color:var(--live);color:var(--live)}
.rbadge{background:var(--live);color:var(--live-ink);border-radius:9px;min-width:18px;height:18px;font-size:11.5px;line-height:18px;text-align:center;padding:0 5px}

/* Day tabs, always the last row so they stay visible when the filters slide away */
.days{display:flex;gap:6px;padding-bottom:10px}
.day{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-weight:700;font-size:14px}
.day[aria-pressed="true"]{background:var(--surface2);color:var(--text);border-color:var(--surface2)}
.days.dim .day{opacity:.45}

.chip:active,.roomsbtn:active,.day:active,.seg button:active{transform:scale(.97)}

/* ---------- Layout ---------- */
main{padding:calc(var(--chrome-h) + 12px) 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(18,22,41,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;min-height:58px;background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--text)}
nav.tabs button[aria-current="page"] svg{color:var(--live)}
nav.tabs svg{width:22px;height:22px}

/* ---------- Now view: the clock is the one loud element ---------- */
.clock{font:800 clamp(72px,24vw,120px)/.88 var(--display);letter-spacing:-.045em;font-variant-numeric:tabular-nums;margin:6px 0 6px}
.today{color:var(--muted);margin:0 0 18px}
.banner{background:var(--surface2);border-radius:var(--r-md);padding:11px 14px;margin:0 0 14px;font-weight:700}
.sec{font:700 16px/1.2 var(--display);color:var(--muted);margin:22px 0 10px}
.note{font-size:14px;color:var(--muted);margin:0 0 12px}

/* ---------- Session cards ---------- */
.card{display:flex;background:var(--surface);border-radius:var(--r-md);margin:0 0 8px;border:1px solid transparent}
.card.live{border-color:var(--live)}
.card.past{opacity:.5}
.card-main{flex:1;min-width:0;padding:12px 0 12px 14px;cursor:pointer;border-radius:var(--r-md) 0 0 var(--r-md)}
.card-main:active{background:rgba(255,255,255,.03)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted)}
.meta .room{color:var(--text);font-weight:700}
.meta .soon{color:var(--live);font-weight:700}
.card h3{font:700 17px/1.25 var(--display);margin:4px 0 3px;overflow-wrap:anywhere}
.who{margin:0;color:var(--muted);font-size:14px}
.inabs{margin:4px 0 0;font-size:13px;color:var(--muted);font-style:italic}
.progress{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--live);border-radius:4px}
.star{flex:none;width:52px;background:none;border:0;color:var(--muted);display:grid;place-items:center}
.star svg{width:24px;height:24px}
.star[aria-pressed="true"]{color:var(--live)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.badge{width:26px;height:26px;border-radius:50%;font:700 11px/26px var(--body);text-align:center;color:#15172a;flex:none}
.badge.more{background:var(--surface2);color:var(--text)}
.slot{font:800 22px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:22px 0 10px;scroll-margin-top:calc(var(--keep-h) + 12px)}
.dayhead{font:800 20px/1.2 var(--display);margin:22px 0 10px}
.dayhead:first-of-type{margin-top:4px}
.brk{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:18px 0}
.brk::before,.brk::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- All day strip ---------- */
details.allday{background:var(--surface);border-radius:var(--r-md);margin:0 0 14px;overflow:hidden}
details.allday summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;cursor:pointer;font:700 16px var(--display)}
details.allday summary::-webkit-details-marker{display:none}
details.allday summary .count{margin-left:auto;font:400 13px var(--body);color:var(--muted)}
details.allday summary svg{width:18px;height:18px}
@media (prefers-reduced-motion:no-preference){details.allday summary svg{transition:transform .2s}}
details.allday[open] summary svg{transform:rotate(180deg)}
.row{display:flex;border-top:1px solid var(--line)}
.row .card-main{padding:10px 0 10px 14px;border-radius:0}
.row h3{font:700 15px/1.25 var(--display);margin:3px 0 0}
.row.live h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:7px;vertical-align:1px}
.row .star{width:48px}

/* ---------- Group view ---------- */
.panel{background:var(--surface);border-radius:var(--r-md);padding:16px;margin:0 0 14px}
.panel h2{font:800 22px/1.15 var(--display);margin:0 0 8px}
.panel p{margin:0 0 12px}
label.field{display:block;font-size:14px;color:var(--muted);margin:0 0 12px}
label.field input{display:block;width:100%;margin-top:6px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 14px;font:16px var(--body)}
.btn{min-height:48px;border-radius:12px;border:0;padding:0 18px;font-weight:700;font-size:16px;background:var(--text);color:var(--bg);width:100%;margin:0 0 8px}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn.warm{background:var(--live);color:var(--live-ink)}
.members{list-style:none;margin:0 0 14px;padding:0}
.members li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.members li:first-child{border-top:0}
.members .n{flex:1}
.members .c{color:var(--muted);font-size:14px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty h2{font:800 22px var(--display);color:var(--text);margin:0 0 6px}
.empty p{margin:0 auto;max-width:34ch}
.empty .btn{width:auto;margin-top:16px}

/* ---------- Sheets ---------- */
dialog.sheet{border:0;padding:0;margin:auto 0 0;width:100%;max-width:100%;max-height:88dvh;background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;overscroll-behavior:contain}
dialog.sheet::backdrop{background:rgba(6,8,18,.65)}
.sheet .inner{padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:88dvh}
.sheet .x{float:right;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;font-size:20px;line-height:1;margin:-4px -4px 0 8px}
.sheet h2{font:800 24px/1.15 var(--display);margin:6px 0 6px;overflow-wrap:anywhere}
.sheet h3{font:700 16px var(--display);margin:20px 0 6px}
.sheet .body p{margin:0 0 10px;max-width:68ch}
.sheet a{color:var(--live)}
.going{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 4px;color:var(--muted);font-size:14px}
@media (min-width:720px){dialog.sheet{margin:auto;max-width:640px;border-radius:20px}}
@media (prefers-reduced-motion:no-preference){
  dialog.sheet[open]{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
}

/* Rooms sheet: a real checklist with big rows */
#rooms .inner{padding-bottom:0}
.rs-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px}
.linkbtn{background:none;border:0;color:var(--live);font-weight:700;font-size:15px;min-height:40px;padding:0 4px}
.rs-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 4px}
.rs-head h3{margin:0;font:700 15px var(--display);color:var(--muted)}
.rlist{list-style:none;margin:0;padding:0;background:var(--bg);border-radius:12px;overflow:hidden}
.rlist li+li{border-top:1px solid var(--line)}
.rtoggle{width:100%;min-height:54px;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0 14px;text-align:left}
.rtoggle:active{background:rgba(255,255,255,.04)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.box svg{width:16px;height:16px;opacity:0}
.rtoggle[aria-pressed="true"] .box{background:var(--live);border-color:var(--live);color:var(--live-ink)}
.rtoggle[aria-pressed="true"] .box svg{opacity:1}
.rn{flex:1;min-width:0;font-weight:700}
.rn small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.rc{color:var(--muted);font-size:14px}
.rs-foot{position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px;border-top:1px solid var(--line)}
.rs-foot .btn{margin:0}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="notch" aria-hidden="true"></div>
<header class="chrome" id="chrome">
  <div class="row-wrap top">
    <h1 class="brand">BSides CBR <span>2026</span></h1>
    <button class="status" id="status" type="button"><i class="dot"></i><span>Loading</span></button>
  </div>
  <div class="row-wrap" id="filters">
    <div class="searchline" id="searchrow"><div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search talks and speakers" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search talks, speakers and rooms">
      <button type="button" class="qclear" data-act="clearsearch" aria-label="Clear search" hidden>×</button>
    </div><button class="roomsbtn" type="button" id="roomsbtn" data-act="rooms" aria-haspopup="dialog"></button></div>
    <div class="seg" id="seg" role="group" aria-label="Whose sessions to show"></div>
    <div class="chipsrow">
      <div class="chips" id="chips" role="group" aria-label="Room types"></div>
    </div>
  </div>
  <div class="row-wrap days" id="days" role="group" aria-label="Day"></div>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Views">
  <button type="button" data-view="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now</button>
  <button type="button" data-view="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
  <button type="button" data-view="group"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3 0 4 1.5 4.6 4"/></svg>Group</button>
</nav>

<dialog class="sheet" id="detail"><div class="inner" id="detailInner"></div></dialog>
<dialog class="sheet" id="rooms" aria-labelledby="roomsTitle"><div class="inner" id="roomsInner"></div></dialog>
<dialog class="sheet" id="join"><div class="inner">
  <button class="x" type="button" data-close aria-label="Close">×</button>
  <h2>Join the group</h2>
  <p class="muted">Your friends will see your name as initials on the talks you star.</p>
  <label class="field">Your name<input id="joinName" maxlength="24" autocomplete="nickname" enterkeyhint="done"></label>
  <button class="btn warm" type="button" id="joinGo">Join group</button>
  <button class="btn ghost" type="button" data-close>Not now</button>
</div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:16px">This app needs JavaScript turned on.</p></noscript>

/* =====================================================================

   Everything displays in Canberra time regardless of the phone's zone.

   ===================================================================== */
const fHM = new Intl.DateTimeFormat("en-AU", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const fDay = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });

const hm = ms => fHM.format(ms);
const dayOf = ms => fDay.format(ms);
const override = (() => {
  const v = new URLSearchParams(location.search).get("now");
  const t = v ? Date.parse(`${v}${v.length === 16 ? ":00" : ""}+10:00`) : NaN;
  return Number.isFinite(t) ? { at: t, loaded: Date.now() } : null;

const now = () => override ? override.at + (Date.now() - override.loaded) : Date.now();

/* =====================================================================
   SMALL UTILITIES
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const store = {
  get(k, d) { try { const v = localStorage.getItem("bsc." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("bsc." + k, JSON.stringify(v)); } catch {} }

function rid(n) {

      const r = await fetch(url, { signal: ctl.signal, cache: "no-store" });
      clearTimeout(timer);
      if (!r.ok) continue;

      let list = parseFrab(j) || parseWidget(j);
      if (!list || list.filter(s => !s.isBreak).length < 20) continue;   // reject partial feeds
      // Breaks come from the snapshot so they look the same whichever feed loaded.
      list = list.filter(s => !s.isBreak).concat(SNAP.filter(s => s.isBreak));
      const at = Date.now();

  const timing = opts.soon
    ? `<span class="soon">${esc(whenText(s.start, t))}</span>`
    : live ? `<span>ends ${hm(s.end)}</span>` : `<span>${hm(s.start)} to ${hm(s.end)}</span>`;
  // If a search hit only the description, say so, otherwise the result looks random.
  const visibleText = norm([s.title, s.speakers.join(" "), s.room, SHORT[s.room] || ""].join(" "));
  const inAbs = toks.length && !toks.every(k => visibleText.includes(k)) ? `<p class="inabs">Matches the talk description</p>` : "";
  return `<article class="card${live ? " live" : ""}${past ? " past" : ""}">
    <div class="card-main" role="button" tabindex="0" data-open="${s.key}">
      <div class="meta"><span class="room">${hl(SHORT[s.room] || s.room, toks)}</span>${timing}</div>
      <h3>${hl(s.title, toks)}</h3>
      ${s.speakers.length ? `<p class="who">${hl(s.speakers.join(", "), toks)}</p>` : ""}
      ${inAbs}${badgesFor(s.key, fi)}
      ${live && opts.progress ? `<div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>` : ""}
    </div>${starBtn(s, on)}</article>`;
}

function allDay(list, c) {
  if (!list.length) return "";
  const { t, ms, fi } = c;
  const liveCount = list.filter(s => s.start <= t && t < s.end).length;
  const rows = list.map(s => {
    const live = s.start <= t && t < s.end;
    return `<div class="row${live ? " live" : ""}">
      <div class="card-main" role="button" tabindex="0" data-open="${s.key}">
        <div class="meta"><span class="room">${esc(SHORT[s.room] || s.room)}</span><span>${hm(s.start)} to ${hm(s.end)}</span></div>
        <h3>${esc(s.title)}</h3>${badgesFor(s.key, fi)}
      </div>${starBtn(s, ms.has(s.key))}</div>`;
  }).join("");
  const count = liveCount ? `${liveCount} on now` : `${list.length} today`;
  return `<details class="allday"${allDayOpen ? " open" : ""}><summary>All day<span class="count">${count}</span>${CHEV}</summary>${rows}</details>`;
}

/* Empty states say why it's empty and offer the one action that fixes it. */
function emptyState(c) {
  if (mode === "mine" && !c.ms.size)
    return `<div class="empty"><h2>No stars yet</h2><p>Tap the star on any talk to build your own day.</p><button class="btn ghost" type="button" data-mode="all">Show everyone</button></div>`;
  if (mode === "group" && !groupId)
    return `<div class="empty"><h2>No group yet</h2><p>Start a group and share the link to see what your friends picked.</p><button class="btn warm" type="button" data-view="group">Set up a group</button></div>`;
  if (mode === "group" && !c.gs.size)
    return `<div class="empty"><h2>No picks yet</h2><p>Nobody in your group has starred anything so far.</p><button class="btn ghost" type="button" data-mode="all">Show everyone</button></div>`;
  const fixes = [];
  if (rooms.length) fixes.push(`<button class="btn ghost" type="button" data-act="clearrooms">Show all rooms</button>`);
  if (mode !== "all") fixes.push(`<button class="btn ghost" type="button" data-mode="all">Show everyone</button>`);
  const why = rooms.length && mode !== "all" ? "your room filter and view" : rooms.length ? "your room filter" : mode === "mine" ? "your stars" : mode === "group" ? "your group's picks" : "";
  const when = view === "now" ? "for the rest of today" : "on this day";
  const msg = why ? `Nothing matches ${why} ${when}.` : `Nothing else is on ${when === "on this day" ? "this day" : "today"}.`;
  return `<div class="empty"><h2>Nothing here</h2><p>${msg}</p>${fixes.join(" ")}</div>`;
}

// When the last non-break session finishes. Worked out from the data so
// schedule changes on the day don't break the "That's a wrap" message.
const lastEnd = () => Math.max(0, ...sessions.filter(s => !s.isBreak).map(s => s.end));

function renderNow(c) {
  const { t } = c, dk = dayOf(t), di = DAYS.indexOf(dk);
  let h = `<p class="clock">${hm(t)}</p><p class="today">${esc(fLong.format(t))}${di >= 0 ? `, day ${di + 1} of 3` : ""}</p>`;
  const brk = sessions.find(s => s.isBreak && s.start <= t && t < s.end);
  if (brk && mode === "all") h += `<div class="banner">${esc(brk.title)} until ${hm(brk.end)}</div>`;

  const live = sessions.filter(s => !s.isBreak && s.start <= t && t < s.end && visible(s, c));
  const longLive = live.filter(s => s.long), talks = live.filter(s => !s.long);
  h += allDay(longLive, c);
  if (talks.length) h += `<h2 class="sec">On now</h2>` + talks.map(s => card(s, c, { progress: true })).join("");

  const later = sessions.filter(s => !s.isBreak && !s.long && s.start > t && visible(s, c));
  const today = later.filter(s => s.day === dk);
  if (today.length) {
    // Only look a short way ahead: the next hour, or 15 min past the earliest
    // upcoming start if that's later. Stops evening events sitting here all day.
    const horizon = Math.max(t + 60 * 60000, today[0].start + 15 * 60000);
    const seen = new Set(), next = [];
    for (const s of today) {
      if (s.start > horizon) break;                 // list is sorted by start time
      if (!seen.has(s.room)) { seen.add(s.room); next.push(s); }
    }
    h += `<h2 class="sec">Up next</h2>` + next.map(s => card(s, c, { soon: true })).join("");
  } else if (!talks.length) {
    const first = later[0];
    if (first) {
      const slot = later.filter(s => s.start - first.start < 5 * 60000);
      h += `<h2 class="sec">Next up, ${esc(fShort.format(first.start))} at ${hm(first.start)}</h2>` + slot.map(s => card(s, c)).join("");
    } else if (t >= lastEnd()) {
      h += `<div class="empty"><h2>That's a wrap</h2><p>BSides Canberra 2026 is over. Your stars are still in Schedule.</p></div>`;
    } else if (!longLive.length) {
      h += emptyState(c);
    }
  }
  return h;
}

function renderSchedule(c) {
  const list = sessions.filter(s => s.day === day);
  let h = allDay(list.filter(s => s.long && visible(s, c)), c);
  let rest = list.filter(s => !s.long && visible(s, c));
  if (!rest.some(s => !s.isBreak)) return h || emptyState(c);
  // Only show a break when there's something before and after it, otherwise filtered views fill up with dividers.
  const talks = rest.filter(s => !s.isBreak);
  rest = rest.filter(s => !s.isBreak || (talks.some(x => x.start < s.start) && talks.some(x => x.start >= s.end)));
  let cur = null;
  for (const s of rest) {
    if (s.isBreak) { h += `<div class="brk">${hm(s.start)} ${esc(s.title)}</div>`; continue; }
    if (s.start !== cur) { cur = s.start; h += `<h2 class="slot" data-start="${s.start}">${hm(s.start)}</h2>`; }
    h += card(s, c);
  }
  return h;
}

function renderSearch(c) {
  const toks = tokens();
  const res = sessions.filter(s => !s.isBreak && visible(s, c, true) && matches(s, toks));
  const scope = mode === "mine" ? " in your stars" : mode === "group" ? " in group picks" : "";
  let h = !res.length ? "" : `<p class="note">${res.length} ${res.length === 1 ? "result" : "results"} across all days${scope}${rooms.length ? ". Room filters are paused while you search" : ""}.</p>`;
  if (!res.length) {
    const widen = mode !== "all" ? `<button class="btn ghost" type="button" data-mode="all">Search everyone</button> ` : "";
    return h + `<div class="empty"><h2>No matches</h2><p>Nothing matches “${esc(query)}”. Try one word from the title or a speaker's first name.</p>${widen}<button class="btn ghost" type="button" data-act="clearsearch">Clear search</button></div>`;
  }
  let cur = null;
  for (const s of res) {
    if (s.day !== cur) { cur = s.day; h += `<h2 class="dayhead">${esc(fLong.format(s.start))}</h2>`; }
    h += card(s, c, { toks });
  }
  return h;
}

function renderGroup() {
  const srcLine = source.kind === "live" ? `Live from pretalx, updated ${hm(source.at)}.`
    : source.kind === "cache" ? `Saved copy from ${esc(fShort.format(source.at))} at ${hm(source.at)}. The live feed isn't reachable right now.`
    : "Built-in offline copy from 23 Sep. Some titles are shortened and talk details are missing until the live feed loads.";
  const dataPanel = `<section class="panel"><h2>Schedule data</h2><p class="muted">${srcLine}</p><button class="btn ghost" type="button" data-act="refresh">Refresh schedule</button></section>`;
  if (!groupId) {
    return `<section class="panel"><h2>Plan with friends</h2>
      <p class="muted">Start a group and share the link. Everyone's stars show up as initials on each talk, live.</p>
      <label class="field">Your name<input id="nm" maxlength="24" autocomplete="nickname" value="${esc(myName)}" enterkeyhint="go"></label>
      <button class="btn warm" type="button" data-act="create">Start a group</button></section>` + dataPanel;
  }
  const ids = Object.keys(group.members || {}).sort((a, b) => a === me ? -1 : b === me ? 1 : (group.members[a].name || "").localeCompare(group.members[b].name || ""));
  const members = ids.map(id => {
    const n = Object.keys(group.bookmarks?.[id] || {}).length;
    return `<li>${badge(id)}<span class="n">${esc(group.members[id].name)}${id === me ? " (you)" : ""}</span><span class="c">${n} ${n === 1 ? "star" : "stars"}</span></li>`;
  }).join("");
  const sync = fbError ? "Can't reach the group service. Your stars are saved on this phone and will sync when you're back online."
    : !fb ? "Connecting to your group…" : connected ? "Synced" : "Offline. Changes will sync when you reconnect.";
  return `<section class="panel"><h2>Your group</h2><p class="muted">${sync}</p>
      ${members ? `<ul class="members">${members}</ul>` : ""}
      <button class="btn warm" type="button" data-act="share">Share invite link</button></section>
    <section class="panel"><h2>Your name</h2>
      <label class="field">Shown to your group<input id="nm" maxlength="24" autocomplete="nickname" value="${esc(myName)}" enterkeyhint="done"></label>
      <button class="btn ghost" type="button" data-act="rename">Save name</button>
      <button class="btn ghost" type="button" data-act="leave">Leave group</button></section>` + dataPanel;
}

/* ---------- Chrome (header, search, view switch, chips, days) ---------- */
function renderChrome() {
  const c = context();
  const [cls, label] = source.kind === "live" ? ["ok", "Live"] : source.kind === "cache" ? ["warn", `Saved ${hm(source.at)}`] : ["warn", "Offline copy"];
  $("#status").innerHTML = `<i class="dot ${cls}"></i><span>${esc(label)}</span>`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));

  $("#filters").hidden = view === "group";

  const segs = [["all", "Everyone", null], ["mine", "Mine", c.ms.size || null], ["group", "Group", groupId && c.gs.size ? c.gs.size : null]];
  $("#seg").innerHTML = segs.map(([m, l, n]) =>
    `<button type="button" data-mode="${m}" aria-pressed="${mode === m}">${l}${n != null ? `<span class="n">${n}</span>` : ""}</button>`).join("");

  const sel = new Set(rooms);
  $("#chips").innerHTML = CHIP_CATS.filter(([cat]) => roomsIn(cat).length).map(([cat, l]) => {
    const rs = roomsIn(cat), on = rooms.length && rs.every(r => sel.has(r)), some = rs.some(r => sel.has(r));
    return `<button class="chip" type="button" data-cat="${cat}" aria-pressed="${on ? "true" : some ? "mixed" : "false"}">${l}</button>`;
  }).join("");
  const rb = $("#roomsbtn");
  rb.classList.toggle("on", !!rooms.length);
  rb.innerHTML = `${SLIDERS}${rooms.length ? `<span class="rbadge">${rooms.length}</span>` : ""}`;
  rb.setAttribute("aria-label", rooms.length ? `Rooms, ${rooms.length} of ${presentRooms.length} selected` : "Rooms, all selected");

  const days = $("#days");
  days.hidden = view !== "schedule";
  days.classList.toggle("dim", !!query);
  days.innerHTML = DAYS.map(d => {
    const ms = Date.parse(`${d}T12:00:00+10:00`);
    return `<button class="day" type="button" data-day="${d}" aria-pressed="${!query && d === day}">${esc(fShort.format(ms).replace(/,/g, ""))}</button>`;
  }).join("");
  const chips = $("#chips"); chips.classList.remove("overflow");
  if (chips.scrollWidth > chips.clientWidth + 1) chips.classList.add("overflow");
  measureChrome();
}

function renderView() {
  const el = $("#view");
  const typing = document.activeElement?.id === "nm" ? document.activeElement.value : null;
  const c = context();
  el.innerHTML = view !== "group" && query ? renderSearch(c) : view === "now" ? renderNow(c) : view === "schedule" ? renderSchedule(c) : renderGroup();
  if (typing !== null && $("#nm")) { const i = $("#nm"); i.value = typing; i.focus(); }
}
function render() {
  renderChrome(); renderView();
  if ($("#rooms").open) renderRooms();
}

/* ---------- Collapsing header ----------
   Scrolling down slides the brand, search and filters away (the day tabs stay).
   Scrolling up brings them back. Same pattern as Safari's toolbar. */
const root = document.documentElement;
let collapsed = false, lastY = 0, acc = 0, quietUntil = 0;
function measureChrome() {
  const ch = $("#chrome"), days = $("#days");
  const h = ch.offsetHeight, keep = $(".notch").offsetHeight + (days.hidden ? 0 : days.offsetHeight);
  root.style.setProperty("--chrome-h", h + "px");
  root.style.setProperty("--keep-h", keep + "px");
  root.style.setProperty("--hide", Math.max(0, h - keep - 1) + "px");
}
function setCollapsed(v) { if (v !== collapsed) { collapsed = v; $("#chrome").classList.toggle("collapsed", v); } }
function jumpTo(y) {
  quietUntil = Date.now() + 500; setCollapsed(false);
  window.scrollTo(0, Math.max(0, y)); lastY = Math.max(0, y); acc = 0;
}
addEventListener("scroll", () => {
  const y = Math.max(0, window.scrollY), dy = y - lastY; lastY = y;
  if (Date.now() < quietUntil) return;
  if (y < 24) { setCollapsed(false); acc = 0; return; }
  if (document.activeElement === $("#q") || document.querySelector("dialog[open]")) return;
  if (Math.sign(dy) !== Math.sign(acc)) acc = 0;
  acc += dy;
  if (acc > 28) setCollapsed(true); else if (acc < -28) setCollapsed(false);
}, { passive: true });
new ResizeObserver(measureChrome).observe($("#chrome"));

/* Put the current time slot just under the header on today's schedule. */
function scrollToNow() {
  if (view !== "schedule" || query || day !== dayOf(now())) return jumpTo(0);
  const t = now(); let target = null;
  document.querySelectorAll(".slot").forEach(h => { if (+h.dataset.start <= t) target = h; });
  if (!target) return jumpTo(0);
  jumpTo(target.getBoundingClientRect().top + window.scrollY - $("#chrome").offsetHeight - 8);
}
const afterFilter = () => scrollToNow();

/* ---------- Rooms sheet ---------- */
function sheetDay() {
  if (view === "schedule") return day;
  return DAYS.includes(dayOf(now())) ? dayOf(now()) : day;
}
function renderRooms() {
  const c = context(), d = sheetDay();
  const dLabel = fShort.format(Date.parse(`${d}T12:00:00+10:00`)).replace(/,/g, "");
  const count = r => sessions.filter(s => !s.isBreak && s.day === d && s.room === r).length;
  const selected = r => !rooms.length || rooms.includes(r);
  const shown = sessions.filter(s => s.day === d && !s.isBreak && visible(s, c)).length;
  let h = `<button class="x" type="button" data-close aria-label="Close">×</button>
    <h2 id="roomsTitle">Rooms</h2>
    <div class="rs-sub"><span class="muted">${rooms.length ? `${rooms.length} of ${presentRooms.length} rooms` : "All rooms"}</span>
    ${rooms.length ? `<button class="linkbtn" type="button" data-act="roomsall">Select all</button>` : ""}</div>
    <p class="note">Numbers show sessions on ${esc(dLabel)}.</p>`;
  for (const [cat, label] of CATS) {
    const rs = roomsIn(cat); if (!rs.length) continue;
    h += `<div class="rs-head"><h3>${label}</h3><button class="linkbtn" type="button" data-only="${cat}">Only ${label.toLowerCase()}</button></div><ul class="rlist">` +
      rs.map(r => {
        const sh = SHORT[r] || r;
        return `<li><button class="rtoggle" type="button" data-roomtoggle="${esc(r)}" aria-pressed="${selected(r)}"><span class="box">${CHECK}</span><span class="rn">${esc(sh)}${!r.startsWith(sh) ? `<small>${esc(r)}</small>` : ""}</span><span class="rc">${count(r)}</span></button></li>`;
      }).join("") + `</ul>`;
  }
  h += `<div class="rs-foot"><button class="btn warm" type="button" data-close>${shown ? `Show ${shown} ${shown === 1 ? "session" : "sessions"}` : "Nothing matches on this day"}</button></div>`;
  $("#roomsInner").innerHTML = h;
}
function setRooms(next) {
  rooms = next.length === presentRooms.length ? [] : next;
  store.set("rooms", rooms); render();
}
function toggleCat(cat) {
  const rs = roomsIn(cat), sel = new Set(rooms);
  if (rooms.length && rs.every(r => sel.has(r))) rs.forEach(r => sel.delete(r)); else rs.forEach(r => sel.add(r));
  setRooms([...sel]);
}
function toggleRoom(r) {
  const sel = new Set(rooms.length ? rooms : presentRooms);
  if (sel.has(r)) sel.delete(r); else sel.add(r);
  if (!sel.size) return toast("Keep at least one room selected");
  setRooms([...sel]);
}

/* ---------- Detail sheet ---------- */
function paras(md) {
  return esc(md).split(/\n{2,}/).map(p => p.trim()).filter(Boolean).map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}
function openDetail(key) {
  const s = byKey.get(key); if (!s) return;
  const on = mineSet().has(key), fi = friendIndex();
  const friends = [...(fi.get(key) || [])];
  const going = friends.length ? `<div class="going">${friends.map(badge).join("")}<span>${esc(friends.map(id => group.members[id].name).join(", "))} ${friends.length === 1 ? "has" : "have"} starred this</span></div>` : "";
  const body = (s.abstract ? paras(s.abstract) : "") + (s.desc && s.desc !== s.abstract ? paras(s.desc) : "");
  const bios = s.bios.map(b => `<h3>About ${esc(b.name)}</h3>${paras(b.bio)}`).join("");
  const missing = !body && source.kind !== "live" ? `<p class="muted">Talk details load when the live schedule is reachable.</p>` : "";
  const link = okUrl(s.url) ? `<p><a href="${esc(s.url)}" target="_blank" rel="noopener">Open on pretalx</a></p>` : "";
  $("#detailInner").innerHTML = `<button class="x" type="button" data-close aria-label="Close">×</button>
    <div class="meta"><span>${esc(fShort.format(s.start))}, ${hm(s.start)} to ${hm(s.end)}</span><span class="room">${esc(s.room)}</span></div>
    <h2>${esc(s.title)}</h2>
    ${s.speakers.length ? `<p class="who">${esc(s.speakers.join(", "))}</p>` : ""}
    ${going}
    <div style="margin:14px 0 6px"><button class="btn ${on ? "ghost" : "warm"}" type="button" data-star="${key}" aria-pressed="${on}">${on ? "Remove star" : "Star this"}</button></div>
    <div class="body">${body}${missing}${bios}${link}</div>`;
  const d = $("#detail"); d.dataset.key = key;
  if (!d.open) d.showModal();
}

/* =====================================================================
   EVENTS
   ===================================================================== */
const q = $("#q");
function clearSearch() {
  q.value = ""; query = ""; $(".qclear").hidden = true;
  render(); scrollToNow();
}
q.addEventListener("input", () => {
  query = q.value.trim(); $(".qclear").hidden = !q.value;
  renderChrome(); renderView(); jumpTo(0);
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); q.blur(); }      // dismiss the iOS keyboard, keep results
  if (e.key === "Escape") clearSearch();
});

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-star],[data-open],[data-view],[data-day],[data-mode],[data-cat],[data-only],[data-roomtoggle],[data-act],[data-close],#status,#joinGo");
  if (!el) {
    if (e.target.matches("dialog.sheet")) e.target.close();   // tap on backdrop
    return;
  }
  if (el.dataset.star) return toggleStar(el.dataset.star);
  if (el.dataset.open) return openDetail(el.dataset.open);
  if (el.dataset.view) {
    view = el.dataset.view; store.set("view", view);
    if (view === "group" && query) { q.value = ""; query = ""; $(".qclear").hidden = true; }
    render(); scrollToNow(); return;
  }
  if (el.dataset.day) {
    if (query) { q.value = ""; query = ""; $(".qclear").hidden = true; }
    day = el.dataset.day; render(); scrollToNow(); return;
  }
  if (el.dataset.mode) {
    mode = el.dataset.mode; store.set("mode", mode);
    render(); if (!query) afterFilter(); return;
  }
  if (el.dataset.cat) { toggleCat(el.dataset.cat); if (!query) afterFilter(); return; }
  if (el.dataset.only) { setRooms(roomsIn(el.dataset.only)); return; }
  if (el.dataset.roomtoggle) return toggleRoom(el.dataset.roomtoggle);
  if (el.hasAttribute("data-close")) return el.closest("dialog").close();
  if (el.id === "status") { view = "group"; store.set("view", view); render(); jumpTo(0); return; }
  if (el.id === "joinGo") {
    const gid = $("#join").dataset.gid;
    if (await joinGroup(gid, $("#joinName").value)) { $("#join").close(); toast("You're in"); view = "group"; store.set("view", view); render(); }
    return;
  }
  switch (el.dataset.act) {
    case "rooms": renderRooms(); roomsBefore = rooms.join("|"); $("#rooms").showModal(); return;
    case "roomsall": return setRooms([]);
    case "clearrooms": setRooms([]); return afterFilter();
    case "clearsearch": return clearSearch();
    case "refresh": return loadLive(true);
    case "create": if (await joinGroup(rid(10), $("#nm").value)) toast("Group started. Share the link with your friends."); return;
    case "rename": {
      const n = $("#nm").value.trim().slice(0, 24);
      if (!n) return toast("Add your name first");
      myName = n; store.set("name", n);
      if (fb && groupId) fb.set(fb.r(`groups/${groupId}/members/${me}`), { name: n, t: Date.now() }).catch(() => {});
      return toast("Name saved");
    }
    case "leave": return leaveGroup();
    case "share": {
      const url = `${location.origin}${location.pathname}#g=${groupId}`;
      try {
        if (navigator.share) await navigator.share({ title: "BSides CBR group", text: "Join my BSides Canberra schedule group", url });
        else { await navigator.clipboard.writeText(url); toast("Invite link copied"); }
      } catch (err) {
        if (err?.name !== "AbortError") { try { await navigator.clipboard.writeText(url); toast("Invite link copied"); } catch { prompt("Copy this link", url); } }
      }
      return;
    }
  }
});
let roomsBefore = "";
$("#rooms").addEventListener("close", () => { if (rooms.join("|") !== roomsBefore && !query) afterFilter(); });

document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset?.open) { e.preventDefault(); openDetail(e.target.dataset.open); }
});
document.addEventListener("toggle", e => {
  if (e.target.matches?.("details.allday")) { allDayOpen = e.target.open; store.set("allday", allDayOpen); }
}, true);

/* Touch: dismiss the keyboard when you start scrolling results,
   and swipe left or right on the schedule to change day. */
let sx = 0, sy = 0, st = 0;
$("#view").addEventListener("touchstart", e => {
  if (document.activeElement === q) q.blur();
  const p = e.touches[0]; sx = p.clientX; sy = p.clientY; st = Date.now();
}, { passive: true });
$("#view").addEventListener("touchend", e => {
  if (view !== "schedule" || query) return;
  const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 45 || Date.now() - st > 600) return;
  const i = DAYS.indexOf(day) + (dx < 0 ? 1 : -1);
  if (i < 0 || i >= DAYS.length) return;
  day = DAYS[i]; render(); scrollToNow();
}, { passive: true });

/* Invite links look like .../#g=abc123xyz */
function checkInvite() {
  const m = /[#&]g=([a-z0-9]{8,16})/.exec(location.hash);
  if (!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  if (m[1] === groupId) { toast("You're already in this group"); return; }
  const d = $("#join"); d.dataset.gid = m[1];
  $("#joinName").value = myName;
  d.showModal();
  setTimeout(() => $("#joinName").focus(), 50);
}
window.addEventListener("hashchange", checkInvite);
window.addEventListener("online", () => { loadLive(); if (groupId && !fb) connectGroup(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { render(); if (source.kind !== "live" || Date.now() - source.at > REFRESH_MS) loadLive(); }
});

/* =====================================================================
   START
   ===================================================================== */
const cached = store.get("cache", null);
if (cached?.list?.length) setSessions(cached.list, { kind: "cache", at: cached.at });
else setSessions(SNAP, { kind: "snapshot", at: null });
scrollToNow();
loadLive();
if (groupId) connectGroup();
checkInvite();
setInterval(() => { if (document.visibilityState === "visible" && view !== "group") renderView(); }, 30000);
setInterval(() => { if (document.visibilityState === "visible") loadLive(); }, REFRESH_MS);
</script>
